# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: admin
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: micro-service-a
  namespace: default
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: website
  lifecycle: experimental
  owner: admin
  system: examples
  hasFeature:
    - feature:default/user-authentication
  providesApis:
    - api:default/example-grpc-api
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: micro-service-b
  namespace: default
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: website
  lifecycle: experimental
  owner: admin
  system: examples
  hasFeature:
    - feature:default/user-registration
  consumesApis:
    - api:default/example-grpc-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
  namespace: default
spec:
  type: grpc
  lifecycle: experimental
  owner: admin
  upstreamBy:
    - feature:default/user-authentication
  downstreamBy:
    - feature:default/user-registration
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
---
# Feature entity - Custom entity kind
apiVersion: backstage.io/v1alpha1
kind: Feature
metadata:
  name: user-authentication
  namespace: default
  description: User authentication feature with OAuth2 and JWT support
spec:
  type: capability
  lifecycle: production
  owner: admin
  featureOf:
    - component:default/micro-service-a
  upstreamOf:
    - api:default/example-grpc-api

---
# Feature entity - Custom entity kind
apiVersion: backstage.io/v1alpha1
kind: Feature
metadata:
  name: user-registration
  namespace: default
  description: User registration feature with email verification
spec:
  type: capability
  lifecycle: production
  owner: admin
  featureOf:
    - component:default/micro-service-b
  downstreamOf:
    - api:default/example-grpc-api

--- 
apiVersion: backstage.io/v1alpha1
kind: Resource 
metadata:
  name: example-database
  namespace: default
spec:
  type: database
  owner: admin
  dependsOn:
    - component:default/micro-service-a
  
--- 
apiVersion: backstage.io/v1alpha1
kind: Resource 
metadata:
  name: example-database
  namespace: default
spec:
  type: database
  owner: admin
  dependsOn:
    - component:default/micro-service-b